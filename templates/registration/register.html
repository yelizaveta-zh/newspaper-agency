{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h2>Register</h2>

  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}

    <button type="submit" class="btn btn-success">Register</button>
    <a href="{% url 'news_agency_app:index' %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
